ia-hidden="true" class="footer_link_icon_svg"><path d="M5 1L10 6M10 6L5 11M10 6H0" stroke="currentColor" stroke-width="0.1em" vector-effect="non-scaling-stroke" stroke-linejoin="bevel" class="u-svg"></path></svg></div></a></div></div></div><div class="g-navbar-body-bg-wrap"><div class="g-navbar-bg-item"></div><div class="g-navbar-bg-item"></div><div class="g-navbar-bg-item"></div><div class="g-navbar-bg-item"></div><div class="g-navbar-bg-item"></div></div><div class="u-embed-css w-embed"></div><div class="u-embed-js w-embed w-script"><script>

// Define the ease variable for consistency
const menuEase = 'expo.out';

// State tracking
let isMenuOpen = false;

// Get the toggle trigger elements
const menuToggle = document.querySelector('[data-menu-trigger="toggle"]');

// Get all close trigger elements
const menuCloses = document.querySelectorAll('[data-menu-trigger="close"]');

// Get the navbar wrap for class toggling
const navbarWrap = document.querySelector('.g-navbar-wrap');

// Function to open the menu
function openMenu() {
  if (isMenuOpen) return;
  isMenuOpen = true;

  // Add is_active class immediately
  if (navbarWrap) {
    navbarWrap.classList.add('is_active');
  }

  // Create a GSAP timeline for the open animation
  const tl = gsap.timeline();

  // Set initial states to prevent blinking
  gsap.set('.g-navbar-body-wrap', { x: '100%', transformStyle: 'preserve-3d' });
  gsap.set('.g-navbar-bg-item', { x: '100%', transformStyle: 'preserve-3d' });
  gsap.set('.g-navbar-item', { opacity: 0, x: '10rem', transformStyle: 'preserve-3d' });
  gsap.set('.g-navbar-social-item', { opacity: 0, x: '10rem', transformStyle: 'preserve-3d' });
  gsap.set('.g-navbar-footer-item', { opacity: 0, y: '10rem', transformStyle: 'preserve-3d' });

  // Animate the main wrapper
  tl.to('.g-navbar-body-wrap', {
    x: '0%',
    duration: 1,
    ease: menuEase
  }, 0);

  // Animate the background items with stagger
  tl.to('.g-navbar-bg-item', {
    x: '0%',
    duration: 1,
    ease: menuEase,
    stagger: 0.075
  }, 0);

  // Animate the menu items with delay and stagger
  tl.to('.g-navbar-item', {
    opacity: 1,
    x: '0rem',
    duration: 1,
    ease: menuEase,
    stagger: 0.1
  }, 0.5);

  // Animate the social items with delay and stagger
  tl.to('.g-navbar-social-item', {
    opacity: 1,
    x: '0rem',
    duration: 1,
    ease: menuEase,
    stagger: 0.1
  }, 0.75);

  // Animate the footer items with stagger
  tl.to('.g-navbar-footer-item', {
    opacity: 1,
    y: '0rem',
    duration: 1,
    ease: menuEase,
    stagger: 0.15
  }, 0.75);
}

// Function to close the menu
function closeMenu() {
  if (!isMenuOpen) return;
  isMenuOpen = false;

  // Remove is_active class immediately
  if (navbarWrap) {
    navbarWrap.classList.remove('is_active');
  }

  // Create a GSAP timeline for the close animation
  const tl = gsap.timeline({
    onComplete: () => {
      // Reset initial states after animation completes to prepare for next open
      gsap.set('.g-navbar-body-wrap', { x: '100%', transformStyle: 'preserve-3d' });
      gsap.set('.g-navbar-bg-item', { x: '100%', transformStyle: 'preserve-3d' });
      gsap.set('.g-navbar-item', { opacity: 0, x: '10rem', transformStyle: 'preserve-3d' });
      gsap.set('.g-navbar-social-item', { opacity: 0, x: '10rem', transformStyle: 'preserve-3d' });
      gsap.set('.g-navbar-footer-item', { opacity: 0, y: '10rem', transformStyle: 'preserve-3d' });
    }
  });

  // Fade out all content items at the same time (no stagger)
  tl.to(['.g-navbar-item', '.g-navbar-social-item', '.g-navbar-footer-item'], {
    opacity: 0,
    duration: 0.35,
    ease: menuEase
  }, 0);

 // Animate the main wrapper out, delayed
  tl.to('.g-navbar-body-wrap', {
    x: '100%',
    duration: 1,
    ease: menuEase
  }, 0.25);
}

// Event listeners
if (menuToggle) {
  menuToggle.addEventListener('click', () => {
    if (isMenuOpen) {
      closeMenu();
    } else {
      openMenu();
    }
  });
}

menuCloses.forEach(closeBtn => {
  closeBtn.addEventListener('click', closeMenu);
});

</script></div></nav></div>
